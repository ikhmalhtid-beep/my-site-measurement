<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Site Measurement</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body>
<section id="home"><header>⌖ MY SITE MEASUREMENT</header><main><h1>Your projects</h1><button id="new">＋ New Project</button><div id="projects"></div></main></section>
<section id="work" hidden><header><button id="back">←</button><b id="title"></b><button id="export">Export PNG</button></header><nav id="tools"><button data-tool="select">Select</button><button data-tool="wall">Wall</button><button data-tool="door">Door</button><button data-tool="window">Window</button><button data-tool="stair">Stair</button><button data-tool="text">Text</button><label><input type="checkbox" id="snap" checked> 90° snap</label><button id="delete" type="button">Delete</button><button id="undo" type="button">Undo</button><button id="zoomReset" type="button">Reset view</button></nav><div class="floors"><span id="floorTabs"></span><button id="addFloor">＋ Add floor</button><span class="unit">Default unit: ft'inch</span></div><canvas id="plan"></canvas><footer id="summary">Rooms: 0 · Total area: 0.00 sqft</footer></section>
<dialog id="projectDialog"><form id="projectForm"><h2>New Project</h2><label>Project name<input id="pname" required></label><label>Client name<input id="client"></label><label>Project address<textarea id="address"></textarea></label><menu><button type="button" id="cancel">Cancel</button><button class="primary">Create project</button></menu></form></dialog>
<dialog id="dimDialog"><form id="dimForm"><h2>Wall dimension</h2><label>Length (ft'inch)<input id="dim" placeholder="12' 6&quot;" required></label><menu><button type="button" id="dimCancel">Cancel</button><button class="primary">Confirm</button></menu></form></dialog>
<script src="app.js"></script></body></html>
